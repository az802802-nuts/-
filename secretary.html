<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>秘書アシスタント｜タスク管理</title>
  <style>
    :root{
      --accent:#5b6be8; --accent-light:#eef0fd; --muted:#6b7682;
      --good:#37d39b; --bg:#e8eaf6; --send:#5b6be8;
    }
    *{box-sizing:border-box; margin:0; padding:0}
    body{font-family:"Noto Sans JP",system-ui,sans-serif; background:var(--bg); min-height:100vh; display:flex; flex-direction:column}
    header{
      background:var(--accent); color:#fff; padding:12px 16px;
      display:flex; align-items:center; gap:10px;
      position:sticky; top:0; z-index:10; box-shadow:0 2px 8px rgba(0,0,0,.15)
    }
    header .hav{width:36px;height:36px;border-radius:50%;background:#fff;display:grid;place-items:center;font-size:20px}
    header .htitle{font-weight:700;line-height:1.2}
    header .hsub{font-size:.75rem;opacity:.85}
    .chat{flex:1; overflow:auto; padding:14px 12px; display:flex; flex-direction:column; gap:10px}
    .row{display:flex; align-items:flex-end; gap:8px}
    .row.right{flex-direction:row-reverse}
    .avatar{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:#fff;font-size:20px;border:1px solid #d0d3f0;flex-shrink:0}
    .bubble{
      background:#fff; border-radius:18px; padding:10px 14px;
      max-width:78%; box-shadow:0 2px 8px rgba(0,0,0,.08);
      opacity:0; transform:translateY(8px); animation:fadeIn .22s ease forwards;
      line-height:1.5
    }
    .bubble.right{background:#dde0ff}
    .meta{font-size:.7rem; color:var(--muted); margin-top:5px}
    .row.right .meta{text-align:right}
    @keyframes fadeIn{to{opacity:1;transform:translateY(0)}}

    /* Task card */
    .task-list{width:100%; border-collapse:collapse}
    .task-list td{padding:5px 4px; vertical-align:top; font-size:.9rem}
    .task-list .tnum{color:var(--muted);font-size:.8rem;white-space:nowrap;padding-right:6px}
    .task-list .tdone{text-decoration:line-through;color:#aaa}
    .task-list .ttag{
      display:inline-block; font-size:.7rem; padding:1px 6px;
      border-radius:999px; margin-left:4px; vertical-align:middle
    }
    .ttag.done{background:#d4f5e9;color:#1a7a5e}
    .ttag.todo{background:#e8eaf6;color:var(--accent)}

    /* Quick chips */
    .quickbar{
      position:sticky; bottom:62px; display:flex; gap:6px;
      padding:6px 12px; overflow-x:auto; scrollbar-width:none
    }
    .quickbar::-webkit-scrollbar{display:none}
    .chip{
      background:#fff; border:1px solid #d0d3f0; color:var(--accent);
      border-radius:999px; padding:5px 12px; font-size:.85rem;
      cursor:pointer; white-space:nowrap; flex-shrink:0
    }
    .chip:hover{background:var(--accent-light)}

    /* Input area */
    footer{
      position:sticky; bottom:0; background:#f5f5fb;
      padding:8px 10px; display:flex; align-items:center; gap:8px;
      border-top:1px solid #d8daf0
    }
    .inputwrap{
      flex:1; display:flex; align-items:center; gap:6px;
      background:#fff; border:1.5px solid #d0d3f0;
      border-radius:24px; padding:7px 14px
    }
    .inputwrap input{flex:1;border:none;outline:none;font-size:1rem}
    .sendbtn{
      background:var(--send); color:#fff; border:none;
      width:42px;height:42px;border-radius:50%; font-size:1.2rem; cursor:pointer;
      display:grid;place-items:center; flex-shrink:0
    }

    /* Typing dots */
    .typing-dots{display:flex;gap:4px;align-items:center;padding:4px 2px}
    .typing-dots span{width:7px;height:7px;background:#b0b8f0;border-radius:50%;animation:dot .9s infinite}
    .typing-dots span:nth-child(2){animation-delay:.2s}
    .typing-dots span:nth-child(3){animation-delay:.4s}
    @keyframes dot{0%,80%,100%{transform:translateY(0)}40%{transform:translateY(-6px)}}
  </style>
</head>
<body>
<header>
  <div class="hav">👩‍💼</div>
  <div>
    <div class="htitle">秘書アシスタント</div>
    <div class="hsub">タスク管理・スケジュール補佐</div>
  </div>
</header>

<div class="chat" id="chat"></div>

<div class="quickbar" id="quickbar">
  <button class="chip" data-q="タスク一覧">📋 タスク一覧</button>
  <button class="chip" data-q="追加">➕ タスク追加</button>
  <button class="chip" data-q="完了">✅ 完了にする</button>
  <button class="chip" data-q="削除">🗑 削除</button>
  <button class="chip" data-q="クリア">🔄 クリア</button>
</div>

<footer>
  <div class="inputwrap">
    <input id="text" type="text" placeholder="メッセージを入力…" autocomplete="off" />
  </div>
  <button class="sendbtn" id="send" title="送信">▶</button>
</footer>

<script>
(()=>{
  const chat=document.getElementById('chat');
  const inp=document.getElementById('text');
  const send=document.getElementById('send');

  let tasks=[]; // {id, text, done, createdAt}
  let nextId=1;
  let awaitingAction=null; // 'add' | 'done' | 'del'

  function nowStr(){
    const d=new Date();
    return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');
  }

  function addRow(content, right=false, sec=false){
    const row=document.createElement('div');
    row.className='row'+(right?' right':'');
    const av=document.createElement('div');
    av.className='avatar';
    av.textContent=right?'🙂':'👩‍💼';
    const bub=document.createElement('div');
    bub.className='bubble'+(right?' right':'');
    if(typeof content==='string') bub.innerHTML=content;
    else bub.appendChild(content);
    const meta=document.createElement('div');
    meta.className='meta';
    meta.textContent=nowStr()+(right?' · 既読':'');
    bub.appendChild(meta);
    if(right){row.appendChild(bub);row.appendChild(av);}
    else{row.appendChild(av);row.appendChild(bub);}
    chat.appendChild(row);
    chat.scrollTop=chat.scrollHeight;
    return bub;
  }

  function secSay(content, delay=0){
    return new Promise(resolve=>{
      setTimeout(()=>{
        const b=addRow(content,false,true);
        resolve(b);
      }, delay);
    });
  }

  function userSay(text){
    addRow(text, true);
  }

  function typing(){
    const row=document.createElement('div');
    row.className='row';
    const av=document.createElement('div');av.className='avatar';av.textContent='👩‍💼';
    const bub=document.createElement('div');bub.className='bubble';
    bub.innerHTML='<div class="typing-dots"><span></span><span></span><span></span></div>';
    row.appendChild(av);row.appendChild(bub);
    chat.appendChild(row);chat.scrollTop=chat.scrollHeight;
    return ()=>chat.contains(row)&&chat.removeChild(row);
  }

  function buildTaskList(filter='all'){
    const list=filter==='todo'?tasks.filter(t=>!t.done):
                filter==='done'?tasks.filter(t=>t.done):tasks;
    if(!list.length) return null;
    const tbl=document.createElement('table');
    tbl.className='task-list';
    list.forEach(t=>{
      const tr=document.createElement('tr');
      tr.innerHTML=`
        <td class="tnum">${t.id}.</td>
        <td class="${t.done?'tdone':''}">${t.text}
          <span class="ttag ${t.done?'done':'todo'}">${t.done?'✅ 完了':'📌 未完'}</span>
        </td>`;
      tbl.appendChild(tr);
    });
    return tbl;
  }

  // --- Intent parsing ---
  function parse(v){
    v=v.trim();
    // 一覧
    if(/^(一覧|リスト|list|タスク一覧|全部|みせて|見せて)$/i.test(v)) return {intent:'list'};
    // クリア
    if(/^(クリア|全削除|リセット|clear)$/i.test(v)) return {intent:'clear'};
    // 完了
    const doneM=v.match(/^(完了|done|終わった|終わり)\s*[:#：]?\s*(\d+)$/i)
              ||v.match(/^(\d+)\s*(完了|done|終わり)$/i);
    if(doneM) return {intent:'done',num:parseInt(doneM[2]||doneM[1])};
    if(/^(完了|done)$/.test(v)) return {intent:'done',num:null};
    // 削除
    const delM=v.match(/^(削除|del|消して?|remove)\s*[:#：]?\s*(\d+)$/i)
              ||v.match(/^(\d+)\s*(削除|del|消して?)$/i);
    if(delM) return {intent:'del',num:parseInt(delM[2]||delM[1])};
    if(/^(削除|del)$/.test(v)) return {intent:'del',num:null};
    // 挨拶
    if(/^(おはよう|こんにちは|こんばんは|ありがとう|よろしく|はじめまして)/i.test(v)) return {intent:'greet',text:v};
    // 追加キーワード
    const addM=v.match(/^(追加|add|タスク追加)\s*[:#：]?\s*(.+)$/i)
              ||v.match(/^(.+)\s+(を|を?)追加$/);
    if(addM) return {intent:'add',text:(addM[2]||addM[1]).trim()};
    if(/^(追加|add|➕)$/.test(v)) return {intent:'add',text:null};
    // デフォルト：入力テキストをタスクとして追加
    return {intent:'add',text:v};
  }

  async function handle(raw){
    const v=raw.trim();
    if(!v) return;
    userSay(v);

    // awaitingAction
    if(awaitingAction){
      const action=awaitingAction;
      awaitingAction=null;
      if(action==='add'){
        addTask(v);
        return;
      }
      if(action==='done'||action==='del'){
        const n=parseInt(v);
        if(isNaN(n)){
          await secSay('番号を入力してください（例：<strong>2</strong>）。', 350);
        } else {
          action==='done'?await doComplete(n):await doDelete(n);
        }
        return;
      }
    }

    const {intent,text,num}=parse(v);

    if(intent==='greet'){
      const greets=[
        'いつでも呼んでください！何かお手伝いできますか？',
        'こちらこそよろしくお願いします。タスクの追加・確認など何でもどうぞ。',
        'お疲れ様です。今日もサポートします！',
      ];
      const rm=typing(); await new Promise(r=>setTimeout(r,700)); rm();
      await secSay(greets[Math.floor(Math.random()*greets.length)]);
      return;
    }

    if(intent==='list'){
      const rm=typing(); await new Promise(r=>setTimeout(r,600)); rm();
      if(!tasks.length){
        await secSay('タスクはまだありません。「追加」で追加できます。');
      } else {
        const todo=tasks.filter(t=>!t.done).length;
        const done=tasks.filter(t=>t.done).length;
        const tbl=buildTaskList();
        await secSay(`現在 <strong>${tasks.length}</strong> 件（未完了 ${todo}件 ／ 完了 ${done}件）`);
        await secSay(tbl, 200);
      }
      return;
    }

    if(intent==='clear'){
      const rm=typing(); await new Promise(r=>setTimeout(r,500)); rm();
      if(!tasks.length){ await secSay('タスクはまだありません。'); return; }
      tasks=[];nextId=1;
      await secSay('タスクをすべて削除しました。');
      return;
    }

    if(intent==='add'){
      if(!text){
        await secSay('追加するタスクを入力してください。', 350);
        awaitingAction='add';
        return;
      }
      await addTask(text);
      return;
    }

    if(intent==='done'){
      if(!num){
        const rm=typing(); await new Promise(r=>setTimeout(r,400)); rm();
        if(!tasks.length){ await secSay('タスクがありません。'); return; }
        const tbl=buildTaskList('todo');
        if(!tbl){ await secSay('未完了のタスクはありません。'); return; }
        await secSay('何番のタスクを完了にしますか？');
        await secSay(tbl, 200);
        awaitingAction='done';
        return;
      }
      await doComplete(num);
      return;
    }

    if(intent==='del'){
      if(!num){
        const rm=typing(); await new Promise(r=>setTimeout(r,400)); rm();
        if(!tasks.length){ await secSay('タスクがありません。'); return; }
        const tbl=buildTaskList();
        await secSay('何番のタスクを削除しますか？');
        await secSay(tbl, 200);
        awaitingAction='del';
        return;
      }
      await doDelete(num);
      return;
    }
  }

  async function addTask(text){
    const task={id:nextId++, text, done:false, createdAt:new Date()};
    tasks.push(task);
    const rm=typing(); await new Promise(r=>setTimeout(r,600)); rm();
    await secSay(`承知しました。タスクを追加しました。<br><strong>「${text}」</strong>`);
    if(tasks.filter(t=>!t.done).length>=3){
      await secSay(`未完了タスクが <strong>${tasks.filter(t=>!t.done).length}</strong> 件あります。「一覧」でご確認できます。`, 500);
    }
  }

  async function doComplete(num){
    const task=tasks.find(t=>t.id===num);
    const rm=typing(); await new Promise(r=>setTimeout(r,500)); rm();
    if(!task){ await secSay(`No.${num} のタスクが見つかりません。「一覧」でご確認ください。`); return; }
    if(task.done){ await secSay(`「${task.text}」はすでに完了済みです。`); return; }
    task.done=true;
    await secSay(`✅ 完了にしました。<br><strong>「${task.text}」</strong>`);
    const remaining=tasks.filter(t=>!t.done).length;
    if(remaining===0) await secSay('すべてのタスクが完了しました！お疲れ様でした。', 400);
    else await secSay(`残り未完了タスクは <strong>${remaining}</strong> 件です。`, 400);
  }

  async function doDelete(num){
    const idx=tasks.findIndex(t=>t.id===num);
    const rm=typing(); await new Promise(r=>setTimeout(r,500)); rm();
    if(idx<0){ await secSay(`No.${num} のタスクが見つかりません。「一覧」でご確認ください。`); return; }
    const [task]=tasks.splice(idx,1);
    await secSay(`🗑 削除しました。<br><strong>「${task.text}」</strong>`);
  }

  // Quick chips
  document.getElementById('quickbar').addEventListener('click',e=>{
    const chip=e.target.closest('[data-q]');
    if(!chip) return;
    handle(chip.dataset.q);
  });

  send.addEventListener('click',()=>{
    const v=inp.value;
    inp.value='';
    handle(v);
  });
  inp.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();send.click();}});

  // Initial greeting
  setTimeout(()=>secSay('こんにちは！秘書アシスタントです。<br>タスクの追加・確認・完了管理をお手伝いします。'),300);
  setTimeout(()=>secSay('使い方：<br>📌 「<strong>タスク名</strong>」と送るだけで追加<br>📋 「<strong>一覧</strong>」でタスク確認<br>✅ 「<strong>完了 1</strong>」で完了にする<br>🗑 「<strong>削除 1</strong>」で削除'),900);
})();
</script>
</body>
</html>
